[package]
name = "uf-msp"
version = "0.1.0"
edition = "2024"

description = "A `no_std` Rust library"
categories = [
  "embedded",
  "no-std",
  "aerospace::drones",
  "aerospace::unmanned-aerial-vehicles",
]
authors = ["Nickolai Novik <nickolainovik@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/jettify/uf-msp"
readme = "README.md"


[dependencies]
defmt = { version = "1.0.1", optional = true }

[dev-dependencies]
serialport = "4.10.1"

[[example]]
name = "raw"
path = "examples/local_raw.rs"
test = false

[features]
"defmt" = ["dep:defmt"]
